<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090E1A">
<meta name="robots" content="noindex, nofollow">
<title>Operacja Kaloryfer · PM POWER LAB</title>
<meta name="description" content="Strategiczny formularz ustalenia wspólnych treningów Piotrka i Bartka. PM POWER LAB × Bistro Pełne Radości.">
<link rel="stylesheet" href="styles.css?v=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23090E1A'/><g stroke='%23C7F94E' stroke-width='5' stroke-linecap='round'><path d='M14 32h36'/><path d='M14 24v16M50 24v16'/></g><g stroke='%2322D3EE' stroke-width='5' stroke-linecap='round'><path d='M8 27v10M56 27v10'/></g></svg>">
</head>
<body>

<div class="ambient" aria-hidden="true">
  <span class="ambient__glow ambient__glow--a"></span>
  <span class="ambient__glow ambient__glow--b"></span>
  <span class="ambient__grid"></span>
</div>

<a class="skip-link" href="#screen">Przejdź do treści formularza</a>

<header class="site-header">
  <div class="brand">
    <svg class="brand__mark" viewBox="0 0 64 64" role="img" aria-label="Monogram PM POWER LAB">
      <defs>
        <linearGradient id="pmp" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#C7F94E"/>
          <stop offset="55%" stop-color="#22D3EE"/>
          <stop offset="100%" stop-color="#3B82F6"/>
        </linearGradient>
      </defs>
      <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="none" stroke="url(#pmp)" stroke-width="1.5" opacity=".55"/>
      <g fill="none" stroke="url(#pmp)" stroke-width="4.5" stroke-linecap="round">
        <path d="M13 32h38"/>
        <path d="M19 23v18M45 23v18"/>
        <path d="M9 27v10M55 27v10"/>
      </g>
    </svg>
    <span class="brand__text">
      <span class="brand__name"><b>PM</b> POWER LAB</span>
      <span class="brand__tagline">Operacja Kaloryfer</span>
    </span>
  </div>
  <p class="site-header__note">Poufny dokument przeznaczony wyłącznie dla dwóch zawodników wysokiego ryzyka: Piotrka i&nbsp;Bartka.</p>
</header>

<div class="progress" id="progress" hidden>
  <div class="progress__bar"><span class="progress__fill" id="progressFill"></span></div>
  <div class="progress__meta">
    <span id="progressStage" class="progress__stage">Pytanie 1 z 12</span>
    <span id="progressPercent" class="progress__percent">0%</span>
  </div>
  <div class="risk" id="riskBadge" data-level="low" hidden>
    <span class="risk__dot" aria-hidden="true"></span>
    <span>Wskaźnik ryzyka wymówek: <span class="risk__value" id="riskValue">Niskie</span></span>
  </div>
</div>

<main>
  <section id="screen" class="card" tabindex="-1" aria-live="polite"></section>
</main>

<nav class="navbar" id="navbar" hidden aria-label="Nawigacja formularza">
  <div class="navbar__inner">
    <button type="button" class="btn btn--ghost" id="btnBack">Wstecz</button>
    <span class="saved" id="savedFlag" role="status" aria-live="polite">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="savedText">Odpowiedzi zapisane</span>
    </span>
    <button type="button" class="btn btn--primary" id="btnNext">Dalej</button>
  </div>
</nav>

<footer class="site-footer">
  <span>PM POWER LAB · Bistro Pełne Radości × Piotr Mądrzyk</span>
  <button type="button" class="linklike" id="btnReset">Zacznij badanie od nowa</button>
</footer>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalBody">
  <div class="modal__box">
    <h2 class="modal__title" id="modalTitle"></h2>
    <p class="modal__body" id="modalBody"></p>
    <div class="modal__actions" id="modalActions"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="printdoc" id="printDoc" aria-hidden="true"></div>

<script src="script.js?v=1"></script>
</body>
</html>
