<style>
  :root{--ink:#15321F;--cream:#F6F1E5;--gold:#A9812F;--gold-dark:#8C6A24}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100svh;display:flex;align-items:center;justify-content:center;
    background:var(--cream);color:var(--ink);font-family:Georgia,'Times New Roman',serif;
    padding:24px;text-align:center}
  .card{max-width:560px}
  .brand{font-family:Arial,Helvetica,sans-serif;font-weight:600;font-size:15px;
    letter-spacing:.24em;margin-bottom:6px}
  .brand b{color:var(--gold);font-weight:600}
  .brand small{display:block;font-size:9px;letter-spacing:.42em;text-transform:uppercase;
    color:#5c6b60;margin-top:5px}
  h1{font-size:clamp(64px,16vw,120px);font-weight:600;line-height:1;margin:34px 0 10px;color:var(--ink)}
  h1 span{color:var(--gold)}
  p.lead{font-size:20px;font-style:italic;color:var(--gold-dark);margin-bottom:10px}
  p.sub{font-size:15px;line-height:1.65;color:#42513f;font-family:Arial,Helvetica,sans-serif}
  a.btn{display:inline-block;margin-top:30px;padding:15px 34px;background:var(--ink);color:var(--cream);
    text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:12.5px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;transition:background .25s ease}
  a.btn:hover{background:#0e2415}
  .leaf{width:44px;height:44px;margin:0 auto 8px;color:var(--gold)}
</style>
</head>
<body>
  <main class="card">
    <svg class="leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>

    <p class="lead">Tego stolika nie ma w naszej sali.</p>
    <p class="sub">Strona, której szukasz, nie istnieje albo zmieniła adres.
    Zapraszamy z powrotem do ogrodu — lunch, pizza i catering czekają.</p>
    <a class="btn" href="/">Wróć na stronę główną</a>
  </main>
