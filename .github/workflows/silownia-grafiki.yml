# Jednorazowy workflow pomocniczy: pobiera wygenerowane ilustracje modułu
# „Operacja Kaloryfer”, konwertuje je do WebP i dopisuje do gałęzi roboczej.
# Po pobraniu grafik ten plik jest usuwany z repozytorium.
name: Grafiki — Operacja Kaloryfer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pobierz:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          ref: claude/pm-power-lab-survey-suxj3l

      - name: Zainstaluj konwerter WebP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Pobierz i przekonwertuj ilustracje
        run: |
          cd pm-growth-lab/silownia/img
          while IFS='|' read -r name url; do
            [ -z "$name" ] && continue
            curl -sS -L --fail -o "/tmp/$name.png" "$url"
            cwebp -quiet -q 80 -resize 1280 0 "/tmp/$name.png" -o "$name.webp"
          done < _zrodla.txt
          rm -f _zrodla.txt
          ls -la

      - name: Zapisz grafiki w gałęzi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pm-growth-lab/silownia/img
          git commit -m "Operacja Kaloryfer: 15 ilustracji WebP"
          git push origin claude/pm-power-lab-survey-suxj3l
